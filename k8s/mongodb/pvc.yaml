# PersistentVolumeClaim (PVC)
# Solicita armazenamento persistente ao cluster Kubernetes.
# Sem o PVC, as avaliações no MongoDB seriam perdidas ao reiniciar o Pod.
# O Deployment monta este volume em /data/db.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
  namespace: fiap-cloud-games
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: fiap-cloud-games
spec:
  accessModes:
    - ReadWriteOnce # um nó por vez pode montar o volume
  resources:
    requests:
      storage: 1Gi
