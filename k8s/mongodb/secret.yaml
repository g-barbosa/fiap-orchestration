# Secrets do MongoDB
# Armazena dados SENSÍVEIS (usuário e senha root).
# Em produção, use um gerenciador de secrets externo.
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secrets
  namespace: fiap-cloud-games
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: fiap-cloud-games
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: "admin"
  MONGO_INITDB_ROOT_PASSWORD: "mongo123"
