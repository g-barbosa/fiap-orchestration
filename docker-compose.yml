version: '3.8'

services:
  # ===========================================
  # INFRAESTRUTURA
  # ===========================================
  
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: rabbitmq123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - fiap-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    hostname: sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Mysql2022!"
      MSSQL_PID: "Developer"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Mysql2022!' -C -Q 'SELECT 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - fiap-network

  redis:
    image: redis:7-alpine
    container_name: redis
    hostname: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - fiap-network

  mongodb:
    image: mongo:7
    container_name: mongodb
    hostname: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: mongo123
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "admin", "-p", "mongo123", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - fiap-network

  # ===========================================
  # KONG API GATEWAY
  # ===========================================

  postgres-kong:
    image: postgres:15-alpine
    container_name: postgres-kong
    hostname: postgres-kong
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong-password-secure
    volumes:
      - postgres_kong_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fiap-network

  kong-migrations:
    image: kong:3.4
    container_name: kong-migrations
    command: kong migrations bootstrap
    depends_on:
      postgres-kong:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres-kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong-password-secure
      KONG_PG_DATABASE: kong
    networks:
      - fiap-network
    restart: "no"

  kong:
    image: kong:3.4
    container_name: kong
    hostname: kong
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres-kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong-password-secure
      KONG_PG_DATABASE: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"  # Proxy HTTP
      - "8443:8443"  # Proxy HTTPS
      - "8001:8001"  # Admin API
      - "8444:8444"  # Admin API HTTPS
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fiap-network

  konga:
    image: pantsel/konga:latest
    container_name: konga
    hostname: konga
    depends_on:
      - kong
    ports:
      - "1337:1337"
    environment:
      NODE_ENV: production
      DB_ADAPTER: postgres
      DB_HOST: postgres-kong
      DB_USER: kong
      DB_PASSWORD: kong-password-secure
      DB_DATABASE: konga
      DB_PORT: 5432
    volumes:
      - konga_data:/var/lib/konga
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:1337"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - fiap-network

  # ===========================================
  # MICROSSERVIÇOS
  # ===========================================

  users-api:
    build:
      context: ../fiap-users-api
      dockerfile: Dockerfile
    image: fiap-users-api:latest
    container_name: users-api
    hostname: users-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Data Source=sqlserver,1433;Initial Catalog=FiapCloudGamesDb;User ID=SA;Password=Mysql2022!;TrustServerCertificate=true"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: admin
      RabbitMq__Password: rabbitmq123
      Jwt__Key: minha-chave-jwt-super-secreta-2026-api-segura
      Jwt__Issuer: FiapCloudGames
      Jwt__Audience: FiapCloudGames
      Jwt__ExpiracaoMinutos: 60
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - fiap-network

  notifications-api:
    build:
      context: ../fiap-notifications-api
      dockerfile: Dockerfile
    image: fiap-notifications-api:latest
    container_name: notifications-api
    hostname: notifications-api
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: admin
      RabbitMq__Password: rabbitmq123
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - fiap-network

  catalog-api:
    build:
      context: ../fiap-catalog-api
      dockerfile: Dockerfile
    image: fiap-catalog-api:latest
    container_name: catalog-api
    hostname: catalog-api
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Data Source=sqlserver,1433;Initial Catalog=FiapCloudGamesCatalogDb;User ID=SA;Password=Mysql2022!;TrustServerCertificate=true"
      ConnectionStrings__Redis: "redis:6379"
      ConnectionStrings__MongoDb: "mongodb://admin:mongo123@mongodb:27017"
      MongoDb__Database: "FiapCloudGamesCatalog"
      Cache__JogosTtlSeconds: "300"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: admin
      RabbitMq__Password: rabbitmq123
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - fiap-network

  payments-api:
    build:
      context: ../fiap-payments-api
      dockerfile: Dockerfile
    image: fiap-payments-api:latest
    container_name: payments-api
    hostname: payments-api
    ports:
      - "8083:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Data Source=sqlserver,1433;Initial Catalog=FiapCloudGamesPaymentsDb;User ID=SA;Password=Mysql2022!;TrustServerCertificate=true"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: admin
      RabbitMq__Password: rabbitmq123
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - fiap-network

# ===========================================
# REDE
# ===========================================
networks:
  fiap-network:
    driver: bridge
    name: fiap-cloud-games-network

# ===========================================
# VOLUMES
# ===========================================
volumes:
  rabbitmq_data:
    name: fiap-rabbitmq-data
  sqlserver_data:
    name: fiap-sqlserver-data
  redis_data:
    name: fiap-redis-data
  mongo_data:
    name: fiap-mongo-data
  postgres_kong_data:
    name: fiap-postgres-kong-data
  konga_data:
    name: fiap-konga-data
