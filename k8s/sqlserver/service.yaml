# ClusterIP: o SQL não é exposto fora do cluster.
apiVersion: v1
kind: Service
metadata:
  name: sqlserver
  namespace: fiap-cloud-games
  labels:
    app: sqlserver
    app.kubernetes.io/name: sqlserver
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: fiap-cloud-games
spec:
  type: ClusterIP
  ports:
    - port: 1433
      targetPort: 1433
      name: sqlserver
  selector:
    app: sqlserver
