# Kong Helm Chart values para o chart atual (proxy LoadBalancer, DB-less).
replicaCount: 1

image:
  repository: kong
  tag: "3.4"
  pullPolicy: IfNotPresent

admin:
  enabled: true
  type: ClusterIP
  http:
    enabled: true
    servicePort: 8001
    containerPort: 8001

proxy:
  enabled: true
  type: LoadBalancer
  http:
    enabled: true
    servicePort: 80
    containerPort: 8000

# As rotas vêm do ConfigMap gerado a partir de k8s/kong/kong.yml.
env:
  database: "off"

dblessConfig:
  configMap: kong-dbless-config

ingressController:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
