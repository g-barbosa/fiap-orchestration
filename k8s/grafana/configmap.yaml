# ConfigMap - datasource Prometheus do Grafana
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: fiap-cloud-games
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: fiap-cloud-games
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
# ConfigMap - provider de dashboards do Grafana
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: fiap-cloud-games
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: fiap-cloud-games
data:
  dashboard.yml: |
    apiVersion: 1
    providers:
      - name: FIAP Cloud Games
        orgId: 1
        folder: FIAP
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
# ConfigMap - dashboard FIAP APIs Overview
# O JSON completo fica também em grafana/dashboards/ no repositório (compose).
# Para K8s, o arquivo é embutido aqui; mantenha as queries alinhadas com o compose.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: fiap-cloud-games
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: fiap-cloud-games
data:
  fiap-apis-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "s",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=~\"users-api|catalog-api\"}[5m])) by (le, job))",
              "legendFormat": "{{job}} p95",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{job=~\"users-api|catalog-api\"}[5m])) by (le, job))",
              "legendFormat": "{{job}} p50",
              "refId": "B"
            }
          ],
          "title": "Latência de requisições (p50 / p95)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "reqps",
              "custom": { "drawStyle": "line", "fillOpacity": 15, "lineWidth": 2, "showPoints": "never" }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "id": 2,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "expr": "sum(rate(http_requests_received_total{job=~\"users-api|catalog-api\"}[5m])) by (job)",
              "legendFormat": "{{job}} total",
              "refId": "A"
            },
            {
              "expr": "sum(rate(http_requests_received_total{job=~\"users-api|catalog-api\"}[5m])) by (job, code)",
              "legendFormat": "{{job}} {{code}}",
              "refId": "B"
            }
          ],
          "title": "Throughput (requisições / s por status)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "percentunit",
              "custom": { "drawStyle": "line", "fillOpacity": 15, "lineWidth": 2, "showPoints": "never" },
              "min": 0
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "id": 3,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "expr": "sum(rate(http_requests_received_total{job=~\"users-api|catalog-api\", code=~\"5..\"}[5m])) by (job) / clamp_min(sum(rate(http_requests_received_total{job=~\"users-api|catalog-api\"}[5m])) by (job), 0.0001)",
              "legendFormat": "{{job}} taxa de erro 5xx",
              "refId": "A"
            },
            {
              "expr": "sum(rate(http_requests_received_total{job=~\"users-api|catalog-api\", code=~\"4..\"}[5m])) by (job)",
              "legendFormat": "{{job}} 4xx / s",
              "refId": "B"
            }
          ],
          "title": "Taxa de erros (5xx % e 4xx / s)",
          "type": "timeseries"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["fiap", "prometheus", "fase-3"],
      "templating": { "list": [] },
      "time": { "from": "now-15m", "to": "now" },
      "timezone": "browser",
      "title": "FIAP Cloud Games - APIs Overview",
      "uid": "fiap-apis-overview",
      "version": 1
    }
