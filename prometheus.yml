global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'fiap-cloud-games'
    environment: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # ========================================
  # FIAP Cloud Games APIs
  # ========================================
  
  - job_name: 'users-api'
    static_configs:
      - targets: ['users-api:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    labels:
      service: 'users-api'
      environment: 'development'

  - job_name: 'catalog-api'
    static_configs:
      - targets: ['catalog-api:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    labels:
      service: 'catalog-api'
      environment: 'development'

  - job_name: 'payments-api'
    static_configs:
      - targets: ['payments-api:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    labels:
      service: 'payments-api'
      environment: 'development'

  - job_name: 'notifications-api'
    static_configs:
      - targets: ['notifications-api:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    labels:
      service: 'notifications-api'
      environment: 'development'

  # ========================================
  # Infrastructure Metrics
  # ========================================
  
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 5s
    labels:
      service: 'rabbitmq'
      environment: 'development'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 5s
    labels:
      service: 'prometheus'
      environment: 'development'

  # ========================================
  # Kong API Gateway
  # ========================================
  
  - job_name: 'kong'
    static_configs:
      - targets: ['kong:8001']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 5s
    labels:
      service: 'kong'
      environment: 'development'
