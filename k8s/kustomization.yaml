# Kustomization para recursos BASE do orquestrador
# Os manifestos de cada projeto são aplicados via scripts (kubectl apply -f)
# devido a restrições de segurança do Kustomize com paths externos
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Labels comuns
commonLabels:
  app.kubernetes.io/part-of: fiap-cloud-games
  app.kubernetes.io/managed-by: kustomize

# Apenas recursos base (compartilhados)
resources:
  - base/namespace.yaml

# Os manifestos de cada projeto estão em seus respectivos repositórios:
# - fiap-users-api/k8s/
# - fiap-notifications-api/k8s/
# 
# Use os scripts em /scripts para aplicar tudo de forma orquestrada.
