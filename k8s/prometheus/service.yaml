# Service do Prometheus
# Expõe a UI/API do Prometheus (porta 9090) dentro do cluster.
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: fiap-cloud-games
  labels:
    app: prometheus
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      name: http
  selector:
    app: prometheus
