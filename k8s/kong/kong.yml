# Configuração declarativa do Kong (services, routes, plugins, consumers).
# O Helm sobe o Kong em DB-less e lê o ConfigMap kong-dbless-config,
# gerado deste arquivo. Troque __JWT_KEY__ pelo segredo jwt-key do Key Vault
# antes de aplicar. Para atualizar as rotas no cluster:
#   kubectl create configmap kong-dbless-config --from-file=kong.yml=k8s/kong/kong.yml -n fiap-cloud-games --dry-run=client -o yaml | kubectl apply -f -
#   kubectl rollout restart deployment -n fiap-cloud-games -l app.kubernetes.io/name=kong
_format_version: "3.0"
_transform: true

services:
  - name: users-api
    url: http://users-api.fiap-cloud-games.svc.cluster.local:80
    connect_timeout: 5000
    write_timeout: 30000
    read_timeout: 30000
    routes:
      # Cadastro e login não exigem token: é aqui que o token é emitido.
      - name: users-api-public
        paths:
          - /api/Usuarios
          - /api/Usuarios/login
        methods:
          - POST
        strip_path: false
      # Demais operações (ex.: tornar-admin) exigem JWT válido.
      - name: users-api-protected
        paths:
          - /api/Usuarios
        methods:
          - GET
          - PATCH
          - PUT
          - DELETE
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp

  - name: catalog-api
    url: http://catalog-api.fiap-cloud-games.svc.cluster.local:80
    connect_timeout: 5000
    write_timeout: 30000
    read_timeout: 30000
    routes:
      - name: catalog-jogos
        paths:
          - /api/Jogos
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
      - name: catalog-bibliotecas
        paths:
          - /api/Bibliotecas
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp

# payments-api e notifications-api ficam de fora por enquanto:
# Payments ainda não tem controllers HTTP (só health/metrics) e Notifications
# está migrando para arquitetura serverless (sem rota fixa no Gateway).

# Consumer representa o emissor de tokens (Users API). __JWT_KEY__ é trocado
# pelo segredo jwt-key do Key Vault na hora de gerar o ConfigMap.
consumers:
  - username: fcg-users-api
    jwt_secrets:
      - key: FiapCloudGames
        algorithm: HS256
        secret: __JWT_KEY__
