# Sincroniza os segredos do cofre fcg-keyvault para Secrets do Kubernetes.
# O valor só é gravado quando um Pod monta o volume do SecretProviderClass fcg-keyvault.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: fcg-keyvault
  namespace: fiap-cloud-games
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "8428d6ea-2943-4740-aed8-76691858c90e"
    keyvaultName: fcg-keyvault
    tenantId: "8a0339a6-65b7-4ae0-9db4-a77f27074251"
    objects: |
      array:
        - |
          objectName: sql-connection
          objectType: secret
        - |
          objectName: sql-sa-password
          objectType: secret
        - |
          objectName: mongo-connection
          objectType: secret
        - |
          objectName: mongo-root-password
          objectType: secret
        - |
          objectName: rabbitmq-password
          objectType: secret
        - |
          objectName: jwt-key
          objectType: secret
        - |
          objectName: elasticsearch-api-key
          objectType: secret
  secretObjects:
    - secretName: users-api-secrets
      type: Opaque
      data:
        - objectName: sql-connection
          key: ConnectionStrings__DefaultConnection
        - objectName: jwt-key
          key: Jwt__Key
        - objectName: rabbitmq-password
          key: RabbitMq__Password
    - secretName: catalog-api-secrets
      type: Opaque
      data:
        - objectName: sql-connection
          key: ConnectionStrings__DefaultConnection
        - objectName: mongo-connection
          key: ConnectionStrings__MongoDb
        - objectName: jwt-key
          key: Jwt__Key
        - objectName: rabbitmq-password
          key: RabbitMq__Password
        - objectName: elasticsearch-api-key
          key: Elasticsearch__ApiKey
    - secretName: sqlserver-secrets
      type: Opaque
      data:
        - objectName: sql-sa-password
          key: MSSQL_SA_PASSWORD
    - secretName: mongodb-secrets
      type: Opaque
      data:
        - objectName: mongo-root-password
          key: MONGO_INITDB_ROOT_PASSWORD
    - secretName: rabbitmq-secrets
      type: Opaque
      data:
        - objectName: rabbitmq-password
          key: RABBITMQ_DEFAULT_PASS
