# Infra do cluster: namespace, mensageria, cache, NoSQL e SQL.
# As APIs ficam nos repositórios de cada serviço.
# Kong (LoadBalancer) é instalado à parte via Helm com k8s/kong/values.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - base/namespace.yaml
  - keyvault/secretproviderclass.yaml
  - rabbitmq/configmap.yaml
  - rabbitmq/service.yaml
  - rabbitmq/deployment.yaml
  - redis/pvc.yaml
  - redis/service.yaml
  - redis/deployment.yaml
  - mongodb/pvc.yaml
  - mongodb/service.yaml
  - mongodb/deployment.yaml
  - sqlserver/pvc.yaml
  - sqlserver/service.yaml
  - sqlserver/deployment.yaml
